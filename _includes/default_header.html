{%- assign page = include.page -%}
{% capture shape %}{% include post_shape.html post=page %}{% endcapture %}
{% assign shape = shape | strip %}
{% capture colour %}{% include post_colour.html post=page %}{% endcapture %}
{% assign colour = colour | strip %}

<div class="default-header {{ colour }} grid-container">
    <div class="hero grid-x">
        <div class="shape cell large-1 medium-1 small-1 grid-y">
            <svg class="bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 102 250" preserveAspectRatio="none">
                <path d="M0 1H102V334H1V1Z" />
                <path d="M1 83L1 1L83 1L1 83Z" fill="white" stroke="white" stroke-width="2"/>
                <path d="M0 250L0 220L30 250Z" fill="white"/>
            </svg>
        </div>
        <div class="content cell large-9 medium-9 small-10">
            <div class="content-block grid-x">
                <div class="hero__title">
                    {{ page.title }}
                </div>
                <div class="hero__summary-block">
                    <div class="hero__summary">{{- page.summary }}</div>
                </div>
            </div>
        </div>
        <div class="shape cell large-2 medium-2 small-1 grid-y">
