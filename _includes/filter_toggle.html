{%- if page.url contains '/popular' -%}
  {%- assign isPopularPage = true -%}
{%- else -%}
  {%- assign isPopularPage = false -%}
{%- endif -%}
<div class="toggle-buttons">
  <a href="/index.html" class="btn{%- unless isPopularPage %} active{%- endunless %}">Latest</a>
  <a href="/popular" class="btn{%- if isPopularPage %} active{%- endif %}">Most Popular</a>
</div>
